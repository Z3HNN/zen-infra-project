name: Deploy Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy VPC
        working-directory: vpc
        run: |
          terraform init
          terraform apply -auto-approve
          echo "VPC_ID=$(terraform output -raw vpc_id)" >> $GITHUB_ENV
          echo "SUBNET_ID=$(terraform output -raw public_subnet_id)" >> $GITHUB_ENV

      - name: Deploy EC2
        working-directory: ec2
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="vpc_id=${{ env.VPC_ID }}" \
            -var="subnet_id=${{ env.SUBNET_ID }}"
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> $GITHUB_ENV

      - name: Deploy Monitoring
        working-directory: monitoring
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="instance_id=${{ env.INSTANCE_ID }}"